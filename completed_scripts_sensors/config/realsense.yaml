camera_name: 'accuracy_test_camera'
enable_color: true                 # Включаем RGB-канал
enable_depth: true
enable_infra1: false
enable_infra2: false
enable_gyro: false
enable_accel: false
enable_pointcloud: true

# Настройки модуля глубины (ОСТАЮТСЯ ПРИОРИТЕТНЫМИ)
depth_module.depth_profile: '640x480x15'
depth_module.depth_format: 'Z16'
depth_module.enable_auto_exposure: true
depth_module.exposure: 8500
depth_module.gain: 16

# Настройки RGB-камеры
rgb_camera.color_profile: '640x480x15'  # Разрешение, согласованное с глубиной
rgb_camera.color_format: 'RGB8'
rgb_camera.enable_auto_exposure: false  # Фиксируем экспозицию для стабильности цветопередачи
# Примечание: Параметры экспозиции/усиления RGB управляются отдельно через динамические параметры

# ФИЛЬТРЫ (остаются включенными для качества глубины)
spatial_filter.enable: true
temporal_filter.enable: true
hole_filling_filter.enable: true
decimation_filter.enable: false
disparity_filter.enable: false
colorizer.enable: false

# КРИТИЧЕСКИ ВАЖНО: Включаем выравнивание глубины к цвету
align_depth.enable: true

# ОПЦИОНАЛЬНО: Включаем аппаратную синхронизацию потоков (рекомендуется)
enable_sync: true
